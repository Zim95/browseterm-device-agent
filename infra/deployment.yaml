# Device Agent Kubernetes manifests (Part 7). Deployed into the LOCAL k3s cluster (macOS/Windows
# Multipass VM, or native Linux k3s) - never the Contabo prod cluster, which only ever runs Cloud.
#
# Image and storage class are now filled in (browseterm-desktop's local_stack.py, macOS Multipass
# phase): `${REPO_NAME}/browseterm-device-agent:latest` (envsubst, same Docker Hub convention
# every other local-stack component uses - see scripts/deployment/build.sh/setup.sh) and
# `local-path` (k3s's own built-in default StorageClass, a fixed fact about k3s itself, not an
# invented value). Resource limits below are still real placeholders where marked.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: browseterm-device-agent
  namespace: browseterm
---
# main.py's read_cert_from_k8s_secret reads container-maker's client mTLS certs directly from the
# k8s API (not a mounted volume - see device_agent/main.py) - this Role/RoleBinding is what makes
# that read actually succeed instead of 403ing. Scoped to get/list on Secrets only, in this
# namespace only (browseterm-desktop's local_stack.py, macOS Multipass phase - found missing
# entirely when wiring Device Agent into the real local stack for the first time).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: browseterm-device-agent-secret-reader
  namespace: browseterm
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: browseterm-device-agent-secret-reader-binding
  namespace: browseterm
subjects:
- kind: ServiceAccount
  name: browseterm-device-agent
  namespace: browseterm
roleRef:
  kind: Role
  name: browseterm-device-agent-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: browseterm-device-agent-local
  namespace: browseterm
spec:
  type: ClusterIP
  selector:
    app: browseterm-device-agent
  ports:
    - name: local-api
      port: 50061
      targetPort: 50061
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: browseterm-device-agent-journal
  namespace: browseterm
spec:
  accessModes: ["ReadWriteOnce"]
  # k3s ships local-path-provisioner as its built-in default StorageClass - a fixed fact about
  # k3s itself, not an invented/environment-specific value, so this is filled in directly rather
  # than left as a placeholder or templated.
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browseterm-device-agent
  namespace: browseterm
spec:
  replicas: 1  # exactly one - a second replica would double-connect the same device identity
  strategy:
    type: Recreate  # never run two pods of this Deployment at once, even mid-rollout
  selector:
    matchLabels:
      app: browseterm-device-agent
  template:
    metadata:
      labels:
        app: browseterm-device-agent
    spec:
      serviceAccountName: browseterm-device-agent
      # Pod Security: non-privileged (migration doc, Part 7 "Non-responsibilities" +
      # Part 23 "Non-privileged Device Agent").
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: device-agent
          image: "${REPO_NAME}/browseterm-device-agent:latest"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLOUD_CONTROL_HOST
              value: "app.browseterm.puhtaeto.com"
            - name: CLOUD_CONTROL_PORT
              value: "443"
            - name: CONTAINER_MAKER_HOST
              value: "container-maker-service"
            - name: CONTAINER_MAKER_CERTS_SECRET_NAME
              value: "container-maker-service-certs"
            - name: NAMESPACE
              value: "browseterm"
            - name: DEVICE_ID_FILE
              value: "/etc/browseterm/device/device_id"
            - name: DEVICE_TOKEN_FILE
              value: "/etc/browseterm/device/token"
            - name: COMMAND_JOURNAL_PATH
              value: "/var/lib/browseterm/device-agent/journal.sqlite3"
          volumeMounts:
            - name: device-credential
              mountPath: /etc/browseterm/device
              readOnly: true
            - name: journal
              mountPath: /var/lib/browseterm/device-agent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              # TODO (Part 24): a real liveness signal (e.g. a small local health file the
              # ConnectionManager touches on every successful Hello/Heartbeat cycle) - not yet
              # implemented; placeholder only.
              command: ["true"]
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: device-credential
          # Populated by the device-linking flow (Part 4) - a Secret, mode 0400, never a
          # ConfigMap. Not created by this manifest; referenced by name only.
          secret:
            secretName: browseterm-device-credential
            defaultMode: 0400
        - name: journal
          persistentVolumeClaim:
            claimName: browseterm-device-agent-journal
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: browseterm-device-agent-egress
  namespace: browseterm
spec:
  podSelector:
    matchLabels:
      app: browseterm-device-agent
  policyTypes: ["Egress"]
  egress:
    # Cloud (outbound only, port 443) - DNS resolution needed, so no fixed CIDR restriction here;
    # tighten to Cloud's real egress IP range once known.
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: browseterm-device-agent-local-api-ingress
  namespace: browseterm
spec:
  podSelector:
    matchLabels:
      app: browseterm-device-agent
  policyTypes: ["Ingress"]
  ingress:
    # Corrected during migration Part 12's actual caller rewiring to the REAL pod labels each
    # workload's own manifest uses (none use a "browseterm-" prefix) - these podSelectors
    # originally guessed at labels that don't exist anywhere, which would have silently blocked
    # every caller under real NetworkPolicy enforcement despite the RPC wiring itself being
    # correct. tunnel_registrar runs as a SIDECAR container inside the ngrok-agent Deployment's
    # Pod (see socket-ssh/infra/deployment/deployment.yaml) - there is no separate
    # "tunnel-registrar" pod/label to select, so its entry below is `app: ngrok-agent`, the label
    # that Pod actually carries.
    - from:
        - podSelector:
            matchLabels:
              app: status-monitor
        - podSelector:
            matchLabels:
              app: reaper
        - podSelector:
            matchLabels:
              app: snapshot-job
        - podSelector:
            matchLabels:
              app: socket-ssh
        - podSelector:
            matchLabels:
              app: ngrok-agent
      ports:
        - port: 50061
          protocol: TCP
